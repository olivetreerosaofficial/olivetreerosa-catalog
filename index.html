<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Olive Tree Catalog</title>
  <style>
    /* RESET & FONT */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }
    body {
      background-color: #fcfcfc;
      color: #333;
    }

    /* HEADER & NAVBAR */
    header {
      position: sticky;
      top: 0;
      background: #ffffff;
      border-bottom: 1px solid #eaeaea;
      padding: 15px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      z-index: 100;
    }
    .logo {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #2b3a2d; /* Warna hijau zaitun tua */
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
    }
    nav {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .nav-btn {
      background: none;
      border: none;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #777;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 20px;
      transition: all 0.3s;
    }
    .nav-btn:hover, .nav-btn.active {
      color: #2b3a2d;
      background: #eef2ed;
      font-weight: 600;
    }

    /* KATALOG CONTAINER */
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 30px;
    }

    /* KARTU PRODUK */
    .card {
      background: #fff;
      border: 1px solid #f0f0f0;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    }
    .card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
    }
    .card-info {
      padding: 16px;
      text-align: center;
    }
    .sku-tag {
      font-size: 11px;
      color: #888;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .card-title {
      font-size: 16px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .card-price {
      font-size: 14px;
      color: #2b3a2d;
      font-weight: 600;
    }

    /* MODAL / POPUP DETAIL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: #fff;
      max-width: 800px;
      width: 100%;
      border-radius: 10px;
      padding: 30px;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 28px;
      background: none;
      border: none;
      cursor: pointer;
      color: #888;
    }
    .close-btn:hover {
      color: #000;
    }

    /* GALERI FOTO DI POP-UP */
    .gallery {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    .main-modal-img {
      width: 100%;
      max-height: 380px;
      object-fit: contain;
      border-radius: 8px;
      background: #f9f9f9;
    }
    .thumbnails {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 5px;
    }
    .thumbnails img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
      border: 2px solid transparent;
      opacity: 0.7;
    }
    .thumbnails img.active-thumb, .thumbnails img:hover {
      border-color: #2b3a2d;
      opacity: 1;
    }
    .modal-details {
      border-top: 1px solid #eee;
      padding-top: 15px;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <a href="#" class="logo" onclick="filterCategory('all')">Olive Tree</a>
    <nav>
      <button class="nav-btn active" onclick="filterCategory('all')">All Products</button>
      <button class="nav-btn" onclick="filterCategory('shoes')">Shoes</button>
      <button class="nav-btn" onclick="filterCategory('bag')">Bag</button>
      <button class="nav-btn" onclick="filterCategory('accessories')">Accessories</button>
      <button class="nav-btn" onclick="filterCategory('discount')">Discount</button>
      <button class="nav-btn" onclick="filterCategory('defected')">Defected Product</button>
    </nav>
  </header>

  <!-- LIST PRODUK -->
  <div class="container">
    <div class="grid" id="productGrid"></div>
  </div>

  <!-- POP-UP DETAIL PRODUK -->
  <div class="modal" id="productModal" onclick="closeModalOnOutside(event)">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      
      <div class="gallery">
        <img id="modalMainImg" class="main-modal-img" src="" alt="Detail Produk">
        <div class="thumbnails" id="modalThumbnails"></div>
      </div>

      <div class="modal-details">
        <span class="sku-tag" id="modalSku"></span>
        <h2 id="modalTitle" style="margin: 5px 0;"></h2>
        <p id="modalPrice" style="font-weight: 600; color: #2b3a2d; margin-bottom: 10px;"></p>
        <p id="modalDesc" style="color: #666; font-size: 14px; line-height: 1.6;"></p>
      </div>
    </div>
  </div>

  <script>
    // DATA PRODUK KAMU (Bisa kamu tambah/edit sendiri foto dan detailnya)
    const products = [
      {
        id: 1,
        sku: "SH-001",
        title: "Olive Classic Loafers",
        category: "shoes",
        price: "Rp 450.000",
        desc: "Sepatu loafer bahan kulit sintetis premium dengan sol empuk dan nyaman.",
        images: [
          "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=600",
          "https://images.unsplash.com/photo-1549298916-b41d501d3772?w=600",
          "https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?w=600"
        ]
      },
      {
        id: 2,
        sku: "BG-002",
        title: "Canvas Tote Bag",
        category: "bag",
        price: "Rp 180.000",
        desc: "Tas tote kanvas tebal dengan kancing magnet dan kantong dalam.",
        images: [
          "https://images.unsplash.com/photo-1544816155-12df9643f363?w=600",
          "https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=600"
        ]
      },
      {
        id: 3,
        sku: "AC-003",
        title: "Leather Card Holder",
        category: "accessories",
        price: "Rp 75.000",
        desc: "Dompet kartu ramping dengan 6 slot kartu dan slot uang tunai.",
        images: [
          "https://images.unsplash.com/photo-1627123424574-724758594e93?w=600"
        ]
      },
      {
        id: 4,
        sku: "DSC-004",
        title: "Retro Sneakers (Sale)",
        category: "discount",
        price: "Rp 299.000",
        desc: "Sepatu kasual diskon khusus akhir musim.",
        images: [
          "https://images.unsplash.com/photo-1560769629-975ec94e6a86?w=600",
          "https://images.unsplash.com/photo-1512374382149-233c42b6a83b?w=600"
        ]
      },
      {
        id: 5,
        sku: "DEF-005",
        title: "Mini Sling Bag (Minor Defect)",
        category: "defected",
        price: "Rp 95.000",
        desc: "Defect: Sedikit goresan kecil di bagian bawah belakang tas, jahitan tetap kokoh.",
        images: [
          "https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600",
          "https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=600"
        ]
      }
    ];

    // RENDER PRODUK KE HALAMAN
    const productGrid = document.getElementById("productGrid");

    function renderProducts(items) {
      productGrid.innerHTML = "";
      items.forEach(prod => {
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => openModal(prod);
        card.innerHTML = `
          <img src="${prod.images[0]}" alt="${prod.title}">
          <div class="card-info">
            <div class="sku-tag">${prod.sku}</div>
            <div class="card-title">${prod.title}</div>
            <div class="card-price">${prod.price}</div>
          </div>
        `;
        productGrid.appendChild(card);
      });
    }

    // FILTER KATEGORI
    function filterCategory(cat) {
      // Ubah gaya tombol aktif
      const buttons = document.querySelectorAll(".nav-btn");
      buttons.forEach(btn => btn.classList.remove("active"));
      event.target.classList.add("active");

      if (cat === "all") {
        renderProducts(products);
      } else {
        const filtered = products.filter(p => p.category === cat);
        renderProducts(filtered);
      }
    }

    // MODAL LOGIC (Klik produk -> Buka banyak foto)
    const modal = document.getElementById("productModal");
    const modalMainImg = document.getElementById("modalMainImg");
    const modalThumbnails = document.getElementById("modalThumbnails");

    function openModal(prod) {
      document.getElementById("modalSku").innerText = "SKU: " + prod.sku;
      document.getElementById("modalTitle").innerText = prod.title;
      document.getElementById("modalPrice").innerText = prod.price;
      document.getElementById("modalDesc").innerText = prod.desc;

      // Atur gambar utama
      modalMainImg.src = prod.images[0];
      modalThumbnails.innerHTML = "";

      // Buat thumbnail kecil di bawahnya jika ada lebih dari 1 foto
      prod.images.forEach((imgSrc, index) => {
        const thumb = document.createElement("img");
        thumb.src = imgSrc;
        if (index === 0) thumb.className = "active-thumb";
        thumb.onclick = () => {
          modalMainImg.src = imgSrc;
          document.querySelectorAll(".thumbnails img").forEach(t => t.classList.remove("active-thumb"));
          thumb.classList.add("active-thumb");
        };
        modalThumbnails.appendChild(thumb);
      });

      modal.classList.add("active");
    }

    function closeModal() {
      modal.classList.remove("active");
    }

    function closeModalOnOutside(e) {
      if (e.target === modal) {
        closeModal();
      }
    }

    // Tampilkan semua produk saat awal buka web
    renderProducts(products);
  </script>
</body>
</html>
